name: Daily Reels report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Fetch + render
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          npx tsx agent.ts
          npx tsx render.ts

      - name: Commit refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp report.html docs/index.html
          cp captions.csv docs/captions.csv
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            today=$(date -u +%F)
            git commit -m "chore: daily Reels report ${today}"
            git push
          fi
